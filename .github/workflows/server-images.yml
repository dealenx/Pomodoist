name: Server images

on:
  push:
    branches: [mod, main, develop]
    paths:
      - 'server/**'
      - 'tool/deploy/web/**'
      - '.github/workflows/server-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db
            context: server
            dockerfile: server/docker/db/Dockerfile
          - name: gateway
            context: server
            dockerfile: server/docker/gateway/Dockerfile
          - name: functions
            context: server
            dockerfile: server/docker/functions/Dockerfile
          - name: web
            context: .
            dockerfile: tool/deploy/web/Dockerfile
            build_args: |
              POMODOIST_BILLING_CHANNEL=stripe
              RELEASE_SHA=${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pomodoist-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}